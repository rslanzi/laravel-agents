name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      # Opens or updates a release PR from the Conventional Commits merged into main. Merging that PR
      # updates CHANGELOG.md, tags the version and publishes the GitHub Release (Packagist picks up the tag).
      # With the default token the release PR does not trigger CI: set a RELEASE_PLEASE_TOKEN secret
      # (a fine-grained token with contents and pull requests write) to have CI run on it.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
