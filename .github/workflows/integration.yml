name: Integration

# Installs the package into a fresh Laravel application and runs the published quality gates,
# so broken stubs, scripts or CI templates are caught before a release.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  fresh-app:
    name: Fresh Laravel ${{ matrix.laravel }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      # Lets Composer install on a PHP version dependencies do not declare yet (8.6 nightly).
      COMPOSER_IGNORE_PLATFORM_REQ: ${{ matrix.experimental == true && 'php+' || '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            laravel: '13'
          # Nightly build of the next PHP version: reported, never blocking.
          - php: '8.6'
            laravel: '13'
            experimental: true

    steps:
      - uses: actions/checkout@v5
        with:
          path: package

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, intl
          coverage: pcov

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create the application
        run: composer create-project "laravel/laravel:^${{ matrix.laravel }}.0" app --prefer-dist --no-interaction --no-progress

      - name: Install the package from this checkout
        working-directory: app
        run: |
          composer config repositories.local '{"type": "path", "url": "../package", "options": {"symlink": false}}'
          composer require --dev "rslanzi/laravel-agents:@dev" laravel/boost --no-interaction --no-progress

      - name: Run agents:install
        working-directory: app
        run: php artisan agents:install --no-interaction

      - name: Run it again (must change nothing)
        working-directory: app
        run: |
          git init -q && git add -A && git -c user.email=ci@example.com -c user.name=ci commit -qm installed
          php artisan agents:install --no-interaction
          git diff --exit-code

      - name: Build frontend assets
        working-directory: app
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build

      # A fresh skeleton covers 33% of app/ and no test declares covers(): write the first test, as a project would.
      - name: Add a first test for the User model
        working-directory: app
        run: |
          cat > tests/Feature/UserTest.php <<'PHP'
          <?php

          declare(strict_types=1);

          use App\Models\User;
          use Illuminate\Support\Facades\Hash;

          covers(User::class);

          it('mass assigns, hashes, casts and hides the user attributes', function (): void {
              $user = User::query()->create(['name' => 'Ada', 'email' => 'ada@example.com', 'password' => 'secret']);
              $user->forceFill(['email_verified_at' => '2026-01-01 10:00:00', 'remember_token' => 'token'])->save();

              $fresh = $user->fresh();

              expect($fresh->name)->toBe('Ada')
                  ->and($fresh->email)->toBe('ada@example.com')
                  ->and(Hash::check('secret', $fresh->password))->toBeTrue()
                  ->and($fresh->email_verified_at)->toBeInstanceOf(DateTimeInterface::class)
                  ->and($fresh->toArray())->not->toHaveKey('password')
                  ->and($fresh->toArray())->not->toHaveKey('remember_token');
          });
          PHP

      - name: Apply Rector and Pint once
        working-directory: app
        run: composer lint

      - name: Quality gates
        working-directory: app
        run: composer check

      - name: Mutation testing
        working-directory: app
        run: composer test:mutate

      - name: Standalone AGENTS.md
        working-directory: app
        run: php artisan agents:markdown --path=AGENTS.standalone.md && test -s AGENTS.standalone.md
